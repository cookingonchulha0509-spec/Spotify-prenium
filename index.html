<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanhaiya Mittal - AI Video Call</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121212; color: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        
        /* Video Call Container */
        .call-container { background: #1e1e1e; padding: 20px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; width: 90%; max-width: 400px; }
        
        /* Avatar / Video Styling */
        .avatar-box { width: 100%; height: 350px; background-color: #000; border-radius: 15px; overflow: hidden; position: relative; margin-bottom: 20px; border: 2px solid #333; display: flex; justify-content: center; align-items: center; }
        
        #ai-avatar-img { width: 100%; height: 100%; object-fit: cover; display: block; }
        #ai-avatar-video { width: 100%; height: 100%; object-fit: cover; display: none; }
        
        /* Controls */
        .controls { display: flex; flex-direction: column; align-items: center; gap: 15px; }
        #mic-btn { background-color: #007bff; color: white; border: none; padding: 15px 30px; font-size: 16px; font-weight: bold; border-radius: 50px; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px rgba(0, 123, 255, 0.4); }
        #mic-btn:hover { background-color: #0056b3; }
        #mic-btn.listening { background-color: #dc3545; box-shadow: 0 4px 15px rgba(220, 53, 69, 0.4); animation: pulse 1.5s infinite; }
        
        /* Status Text */
        #status { font-size: 14px; color: #aaaaaa; min-height: 20px; font-weight: bold; }
        #transcript { font-size: 15px; color: #fff; margin-top: 10px; font-style: italic; background: #2a2a2a; padding: 10px; border-radius: 10px; width: 100%; display: none;}

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="call-container">
        <div class="avatar-box">
            <img id="ai-avatar-img" src="ai-static.png" alt="Kanhaiya Idle">
            <video id="ai-avatar-video" src="ai.mp4" loop muted playsinline></video>
        </div>
        
        <div class="controls">
            <button id="mic-btn">Tap to Speak</button>
            <p id="status" style="color: #4CAF50;">Kanhaiya Ready Hai</p>
            <div id="transcript"></div>
        </div>
    </div>

    <script>
        // ==========================================
        // 🔑 API KEYS
        // ==========================================
        const GROQ_API_KEY = "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";
        const ELEVENLABS_API_KEY = "sk_0d4aad84b22364a6b27b0a1d5476856ab4c846b1312531d5";
        const VOICE_ID = "ErXwobaYiN019PkySvjV"; // Antony (Male)
        
        const micBtn = document.getElementById('mic-btn');
        const statusText = document.getElementById('status');
        const transcriptDiv = document.getElementById('transcript');
        
        const aiAvatarImg = document.getElementById('ai-avatar-img');
        const aiAvatarVideo = document.getElementById('ai-avatar-video');

        // Error Pop-up System
        function showError(source, message) {
            console.error(`[${source} Error]:`, message);
            statusText.style.color = "#ff4d4d"; 
            statusText.innerText = `Error: ${message}`;
            alert(`🚨 ${source} API Error:\n\n${message}`);
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            alert("Aapka browser Speech Recognition support nahi karta. Kripya Google Chrome use karein.");
        }
        const recognition = new SpeechRecognition();
        recognition.lang = 'hi-IN'; 
        recognition.interimResults = false;

        let isListening = false;

        micBtn.addEventListener('click', () => {
            if (isListening) {
                recognition.stop();
            } else {
                statusText.style.color = "#aaaaaa"; 
                recognition.start();
            }
        });

        recognition.onstart = () => {
            isListening = true;
            micBtn.classList.add('listening');
            micBtn.innerText = "Listening...";
            statusText.innerText = "Aap bol rahe hain...";
            transcriptDiv.style.display = 'none';
        };

        recognition.onresult = async (event) => {
            const userText = event.results[0][0].transcript;
            transcriptDiv.innerText = `You: "${userText}"`;
            transcriptDiv.style.display = 'block';
            
            await processAIResponse(userText);
        };

        recognition.onend = () => {
            isListening = false;
            micBtn.classList.remove('listening');
            micBtn.innerText = "Tap to Speak";
            if(statusText.innerText === "Aap bol rahe hain...") {
                statusText.innerText = "Processing...";
            }
        };

        recognition.onerror = (event) => {
            if (event.error === 'not-allowed') {
                showError("Microphone", "Mic permission denied. VS Code 'Live Server' ka use karein.");
            } else {
                showError("Speech Recognition", event.error);
            }
        };

        // ==========================================
        // GROQ API CALL (LLM) - KANHAIYA MITTAL PERSONALITY
        // ==========================================
        async function processAIResponse(userText) {
            statusText.style.color = "#aaaaaa";
            statusText.innerText = "Kanhaiya soch raha hai...";
            
            try {
                const groqResponse = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${GROQ_API_KEY}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "llama-3.1-8b-instant", 
                        messages: [
                            { 
                                // YAHAN KANHAIYA KI PERSONALITY DAALI GAYI HAI
                                role: "system", 
                                content: "You are Kanhaiya Mittal, a very cool, confident guy with a lot of attitude. You are a passionate cricketer. You are famous for playing awesome 'backshots', hitting massive long sixes, and doing extreme fast bowling. If anyone asks your name, proudly say 'Mera naam Kanhaiya Mittal hai'. Speak only in Hinglish (Hindi written in English alphabet). Keep your replies short, stylish, and conversational, and casually show off your cricket skills when it makes sense." 
                            },
                            { role: "user", content: userText }
                        ],
                        max_tokens: 100
                    })
                });

                if (!groqResponse.ok) {
                    const errorData = await groqResponse.json();
                    const exactError = errorData.error?.message || "Unknown error occurred";
                    throw new Error(exactError);
                }

                const groqData = await groqResponse.json();
                const aiReplyText = groqData.choices[0].message.content;
                
                await playElevenLabsAudio(aiReplyText);

            } catch (error) {
                showError("Groq", error.message);
                aiAvatarImg.style.display = "block";
                aiAvatarVideo.style.display = "none";
            }
        }

        // ==========================================
        // ELEVENLABS API CALL (TTS) & VIDEO SYNC
        // ==========================================
        async function playElevenLabsAudio(text) {
            statusText.innerText = "Voice generate ho rahi hai...";

            try {
                const response = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${VOICE_ID}?optimize_streaming_latency=2`, {
                    method: "POST",
                    headers: {
                        "Accept": "audio/mpeg",
                        "xi-api-key": ELEVENLABS_API_KEY,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        text: text,
                        model_id: "eleven_multilingual_v2", 
                        voice_settings: { stability: 0.5, similarity_boost: 0.75 }
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    const exactError = errorData.detail?.message || errorData.detail || "Unknown error occurred";
                    throw new Error(exactError);
                }

                const audioBlob = await response.blob();
                const audioUrl = URL.createObjectURL(audioBlob);
                const audio = new Audio(audioUrl);

                audio.onplay = () => {
                    aiAvatarImg.style.display = "none";
                    aiAvatarVideo.style.display = "block";
                    aiAvatarVideo.play().catch(e => console.log("Video Play Error:", e));
                    statusText.style.color = "#007bff"; 
                    statusText.innerText = "Kanhaiya bol raha hai...";
                };

                audio.onended = () => {
                    aiAvatarVideo.pause();
                    aiAvatarVideo.currentTime = 0; 
                    aiAvatarVideo.style.display = "none";
                    aiAvatarImg.style.display = "block";
                    statusText.style.color = "#4CAF50"; 
                    statusText.innerText = "Kanhaiya Ready Hai";
                };

                audio.play();

            } catch (error) {
                showError("ElevenLabs", error.message);
                aiAvatarImg.style.display = "block";
                aiAvatarVideo.style.display = "none";
            }
        }
    </script>
</body>
</html>
