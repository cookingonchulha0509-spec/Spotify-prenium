<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart AI Video Call Agent</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121212; color: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        
        /* Video Call Container */
        .call-container { background: #1e1e1e; padding: 20px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; width: 90%; max-width: 400px; }
        
        /* Avatar / Video Styling */
        .avatar-box { width: 100%; height: 350px; background-color: #000; border-radius: 15px; overflow: hidden; position: relative; margin-bottom: 20px; border: 2px solid #333; display: flex; justify-content: center; align-items: center; }
        
        /* Image aur Video dono ko avatar box mein fit karne ke liye */
        #ai-avatar-img { width: 100%; height: 100%; object-fit: cover; display: block; }
        #ai-avatar-video { width: 100%; height: 100%; object-fit: cover; display: none; } /* Default hide rahega */
        
        /* Controls */
        .controls { display: flex; flex-direction: column; align-items: center; gap: 15px; }
        #mic-btn { background-color: #007bff; color: white; border: none; padding: 15px 30px; font-size: 16px; font-weight: bold; border-radius: 50px; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px rgba(0, 123, 255, 0.4); }
        #mic-btn:hover { background-color: #0056b3; }
        #mic-btn.listening { background-color: #dc3545; box-shadow: 0 4px 15px rgba(220, 53, 69, 0.4); animation: pulse 1.5s infinite; }
        
        /* Status Text */
        #status { font-size: 14px; color: #aaaaaa; min-height: 20px; }
        #transcript { font-size: 15px; color: #fff; margin-top: 10px; font-style: italic; background: #2a2a2a; padding: 10px; border-radius: 10px; width: 100%; display: none;}

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="call-container">
        <div class="avatar-box">
            <img id="ai-avatar-img" src="ai-static.png" alt="AI Agent Idle">
            
            <video id="ai-avatar-video" src="ai.mp4" loop muted playsinline></video>
        </div>
        
        <div class="controls">
            <button id="mic-btn">Tap to Speak</button>
            <p id="status">System Ready</p>
            <div id="transcript"></div>
        </div>
    </div>

    <script>
        // ==========================================
        // 🔑 API KEYS (Aapki Provide Ki Gayi Keys)
        // ==========================================
        const GROQ_API_KEY = "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";
        const ELEVENLABS_API_KEY = "sk_0d4aad84b22364a6b27b0a1d5476856ab4c846b1312531d5";
        const VOICE_ID = "ErXwobaYiN019PkySvjV"; // Antony (Male)
        
        // DOM Elements
        const micBtn = document.getElementById('mic-btn');
        const statusText = document.getElementById('status');
        const transcriptDiv = document.getElementById('transcript');
        
        // Avatar Elements
        const aiAvatarImg = document.getElementById('ai-avatar-img');
        const aiAvatarVideo = document.getElementById('ai-avatar-video');

        // Web Speech API for Voice to Text
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            alert("Aapka browser Speech Recognition support nahi karta. Kripya Google Chrome ka use karein.");
        }
        const recognition = new SpeechRecognition();
        recognition.lang = 'hi-IN'; // Hindi-English mix
        recognition.interimResults = false;

        let isListening = false;

        // Mic Button Click Event
        micBtn.addEventListener('click', () => {
            if (isListening) {
                recognition.stop();
            } else {
                recognition.start();
            }
        });

        recognition.onstart = () => {
            isListening = true;
            micBtn.classList.add('listening');
            micBtn.innerText = "Listening...";
            statusText.innerText = "Aap bol rahe hain...";
            transcriptDiv.style.display = 'none';
        };

        recognition.onresult = async (event) => {
            const userText = event.results[0][0].transcript;
            transcriptDiv.innerText = `You: "${userText}"`;
            transcriptDiv.style.display = 'block';
            
            // Text milne ke baad AI ko bhejein
            await processAIResponse(userText);
        };

        recognition.onspeechend = () => {
            recognition.stop();
        };

        recognition.onend = () => {
            isListening = false;
            micBtn.classList.remove('listening');
            micBtn.innerText = "Tap to Speak";
            if(statusText.innerText === "Aap bol rahe hain...") {
                statusText.innerText = "Processing...";
            }
        };

        recognition.onerror = (event) => {
            if (event.error === 'not-allowed') {
                statusText.innerText = "Error: Mic permission denied. Please use Live Server!";
                alert("Browser ne Mic block kar diya hai. Kripya is file ko VS Code ke 'Live Server' se open karein ya Localhost par chalayein.");
            } else {
                statusText.innerText = `Error: ${event.error}`;
            }
        };

        // ==========================================
        // GROQ API CALL (LLM)
        // ==========================================
        async function processAIResponse(userText) {
            statusText.innerText = "AI soch raha hai...";
            
            try {
                const groqResponse = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${GROQ_API_KEY}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "openai/gpt-oss-120b", // Sahi aur fast model lagaya gaya hai
                        messages: [
                            { role: "system", content: "You are a helpful AI video call assistant. Keep your answers short, conversational, and reply in Hinglish (Hindi written in English alphabet) or Hindi." },
                            { role: "user", content: userText }
                        ],
                        max_tokens: 100
                    })
                });

                const groqData = await groqResponse.json();
                const aiReplyText = groqData.choices[0].message.content;
                
                // Text milne ke baad Voice generate karein
                await playElevenLabsAudio(aiReplyText);

            } catch (error) {
                console.error(error);
                statusText.innerText = "Groq API Error!";
            }
        }

        // ==========================================
        // ELEVENLABS API CALL (TTS) & VIDEO SYNC
        // ==========================================
        async function playElevenLabsAudio(text) {
            statusText.innerText = "Voice generate ho rahi hai...";

            try {
                const response = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${VOICE_ID}?optimize_streaming_latency=2`, {
                    method: "POST",
                    headers: {
                        "Accept": "audio/mpeg",
                        "xi-api-key": ELEVENLABS_API_KEY,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        text: text,
                        model_id: "eleven_multilingual_v2", // Multilingual model for Hindi/Hinglish
                        voice_settings: { stability: 0.5, similarity_boost: 0.75 }
                    })
                });

                if (!response.ok) throw new Error("ElevenLabs API failed");

                const audioBlob = await response.blob();
                const audioUrl = URL.createObjectURL(audioBlob);
                const audio = new Audio(audioUrl);

                // Jab audio play ho, tab Static Image chupayein aur MP4 play karein
                audio.onplay = () => {
                    aiAvatarImg.style.display = "none";
                    aiAvatarVideo.style.display = "block";
                    aiAvatarVideo.play();
                    statusText.innerText = "AI bol raha hai...";
                };

                // Jab audio khatam ho, tab MP4 rokein aur wapas Static Image lagayein
                audio.onended = () => {
                    aiAvatarVideo.pause();
                    aiAvatarVideo.currentTime = 0; // Video ko wapas start par set karein
                    aiAvatarVideo.style.display = "none";
                    aiAvatarImg.style.display = "block";
                    statusText.innerText = "System Ready";
                };

                // Play the audio
                audio.play();

            } catch (error) {
                console.error(error);
                statusText.innerText = "ElevenLabs API Error!";
            }
        }
    </script>
</body>
</html>
